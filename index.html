<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>关于我</title>
  <style>
  body {
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#333;
    text-align:center;
    padding:20px;
  }
   
  h1 {color:#2c3e50;}
  h2 {color:#34495e;}
  
  nav {
    display:flex;
  justify-content:center;
  gap:20px;
  }
  .contact-form{
display:flex;
flex-direction:column;
gap:15px;
align-items:center;
}

  .contact-form input,
  .contact-form textarea{
    width:80%;
    max-width:400px;
  }
  .card {
    background:white;
    max-width:600px;
    margin:20px auto;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px
    rgba(0,0,0,0.1);
  }
  
  .poster-img {
  width: 100%;              /* 占满卡片宽度 */
  max-width: 500px;         /* 最大限制，防止太大 */
  height: auto;             /* 高度自动等比例缩放，不变形 */
  border-radius: 10px;      /* 给图片加圆角 */
  margin: 15px auto;        /* 上下留点空隙，左右居中 */
  display: block;           /* 确保 margin auto 生效 */
  box-shadow: 0 4px 8px rgba(0,0,0,0.1); /* 加个阴影 */
}

  input,textarea {
    width:90%;
    padding:10px;
    margin:5px 0;
    border:1px solid #ccc;
    border-radius:5px;
  }
 
  button {
    background:#3498db;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:5px;
    cursor:pointer;
  }
  
  footer {
    color:#999;
    margin-top:30px;
  } 
  ul,ol {
    text-align:left;
    display:inline-block;
    padding-left:20px;
  }
  @media (max-width:600px){
    body {
      padding:10px;
    }
    nav {
      flex-direction:column;
      gap:10px;
    }
    .card {
      padding:15px;
    }
  }
  </style>
</head>

<body>
  
  <audio id="bgm" loop>
    <source src="bgm.mp3" type="audio/mpeg">
  </audio>
  
  <button id="musicBtn" type="button">🎵播放音乐</button>
 
<header>
  <h1>宋智伟</h1>
  <nav>
    <a href="#about">关于我</a>
    <a href="#hobby">爱好</a>
    <a href="#contact">联系</a>
  </nav>
</header>

<main>
  <section id="about" class="card">
  <h2>关于我</h2>
  <!-- 新加的图片 -->
  <img src="ezio.jpg" alt="Ezio" class="poster-img">
  <p>我来自中国，在韩国读计算机硕士</p>
</section>
  
  <section id="hobby" class="card">
    <h2>我的爱好</h2>
    <ul>
      <li>看电影</li>
      <li>玩电子游戏</li>
      <li>写代码</li>
    </ul>
  </section>
  
  <section id="contact" class="card">
    <h2>联系我</h2>
    <form class="contact-form">
      <input type="text"
      placeholder="你的姓名"
      id="username">
      <input type="email"
      placeholder="你的邮箱"
      id="useremail">
      <textarea placeholder="留言"
      id="usermessage">
      </textarea>
      <button id="submitBtn" type="button">提交</button>
    </form>
  </section>
  <section id="messages"class="card">
    <h2>大家的留言</h2>
    <div id="messageList"></div>
  </section>
</main>

<footer>
  <p>Copyright 2026 宋智伟</p>
</footer>

<script>

let bgm = 
document.getElementById("bgm");
let musicBtn = 
document.getElementById("musicBtn");

musicBtn.addEventListener("click",function(){
  if(bgm.paused){
    bgm.play();
    musicBtn.innerText = "⏸ 暂停音乐";
  }
  else{
    bgm.pause();
    musicBtn.innerText = "🎵 播放音乐";
  }
});

let messageArray = [];
let submitBtn = 
document.getElementById("submitBtn");
submitBtn.addEventListener("click",sayHello);

function sayHello() {
  let nameInput = 
document.querySelector("#username").value;
  let emailInput =
document.querySelector("#useremail").value;
  let messageInput =
document.querySelector("#usermessage").value;

  if (nameInput === ""){
    alert("请先填写你的姓名哦！");
    return;
  }

  let userData = {
    userName:nameInput,
    userEmail:emailInput,
    userMessage:messageInput
  };
  
  messageArray.unshift(userData);
  renderMessages();
  
  document.querySelector("#username").value = "";
  document.querySelector("#useremail").value = "";
  document.querySelector("#usermessage").value = "";
    
  console.log("用户提交的数据：",userData);
  
  alert("你好，" + userData.userName +"！你的留言我已收到。");
  
  fetch("https://my-backend-api-ws4p.onrender.com/submit",{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify(userData)})
    .then(response=>response.json())
    .then(data=>{console.log("服务器收到数据了！这是回执：",data);})
    .catch(error=>{
      console.error("糟糕，出错了：",error);
    });
  }

 function renderMessages(){
   let listContainer = document.querySelector("#messageList");
   listContainer.innerHTML = "";
   
   messageArray.forEach(function(msg){
     let div = 
     document.createElement("div");
     div.style.borderBottom = "1px solid #eee";
     div.style.padding = "10px 0";
     div.style.textAlign = "left";
     div.innerHTML = `<strong>${msg.userName}</strong>
     (${msg.userEmail})<br>
     <span>${msg.userMessage}</span>`;
     listContainer.appendChild(div);
     });
   }
   
   // 页面加载时，去后端拉取已有的留言
window.onload = function() {
  fetch("https://my-backend-api-ws4p.onrender.com/messages")
    .then(response => response.json())
    .then(data => {
      messageArray = data; // 把后端存的数据赋值给前端数组
      renderMessages(); // 重新渲染到页面
    })
    .catch(error => console.error("获取留言失败：", error));
};
</script>
</body>
</html>
