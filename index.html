<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>关于我</title>
  <style>
  body {
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#333;
    text-align:center;
    padding:20px;
  }
   
  h1 {color:#2c3e50;}
  h2 {color:#34495e;}
  
  nav {
    display:flex;
  justify-content:center;
  gap:20px;
  }
  .contact-form{
display:flex;
flex-direction:column;
gap:15px;
align-items:center;
}

  .contact-form input,
  .contact-form taxtarea{
    width:80%;
    max-width:400px;
  }
  .card {
    background:white;
    max-width:600px;
    margin:20px auto;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px
    rgba(0,0,0,0.1);
  }
    
  input,textarea {
    width:90%;
    padding:10px;
    margin:5px 0;
    border:1px solid #ccc;
    border-radius:5px;
  }
 
  button {
    background:#3498db;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:5px;
    cursor:pointer;
  }
  
  footer {
    color:#999;
    margin-top:30px;
  } 
  ul,ol {
    text-align:left;
    display:inline-block;
    padding-left:20px;
  }
  @media (max-width:600px){
    body {
      padding:10px;
    }
    nav {
      flex-direction:colum;
      gap:10px;
    }
    .card {
      padding:15px;
    }
  }
  </style>
</head>

<body>
  
  <audio id="bgm" loop>
    <source src="bgm.mp3" type="audio/mpeg">
  </audio>
  
  <button id="musicBtn" type="button">🎵播放音乐</button>
 
<header>
  <h1>宋智伟</h1>
  <nav>
    <a href="#about">关于我</a>
    <a href="#hobby">爱好</a>
    <a href="#contact">联系</a>
  </nav>
</header>

<main>
  <section id="about" class="card">
    <h2>关于我</h2>
    <p>我来自中国，在韩国读计算机硕士</p>
  </section>
  
  <section id="hobby" class="card">
    <h2>我的爱好</h2>
    <ul>
      <li>看电影</li>
      <li>玩电子游戏</li>
      <li>写代码</li>
    </ul>
  </section>
  
  <section id="contact" class="card">
    <h2>联系我</h2>
    <form class="contact-form">
      <input type="text"
      placeholder="你的姓名"
      id="username">
      <input type="email"
      placeholder="你的邮箱"
      id="useremail">
      <textarea placeholder="留言"
      id="usermessage">
      </textarea>
      <button id="submitBtn" type="button">提交</button>
    </form>
  </section>
</main>

<footer>
  <p>Copyright 2026 宋智伟</p>
</footer>

<script>

let bgm = 
document.getElementById("bgm");
let musicBtn = 
document.getElementById("musicBtn");

musicBtn.addEventListener("click",function(){
  if(bgm.paused){
    bgm.play();
    musicBtn.innerText = "⏸ 暂停音乐";
  }
  else{
    bgm.pause();
    musicBtn.innerText = "🎵 播放音乐";
  }
});

let userCard = {
  name:"宋智伟",
  email:"test@naver.com",
  message:"我是全栈开发者"
};

function sayHello() {
  let nameInput = 
document.querySelector("#username").value;
　let emailInput =
document.querySelector("#useremail").value;
  let messageInput =
document.querySelector("#usermessage").value;

  let userData = {
    userName:nameInput,
    userEmail:emailInput,
    userMessage:messageInput};
    
  console.log("用户提交的数据：",userData);
  
  alert("你好，" + userData.userName +"！你的留言我已收到。");
  
  fetch("https://my-backend-api-ws4p.onrender.com/submit",{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify(userData)})
    .then(response=>response.json())
    .then(data=>{console.log("服务器收到数据了！这是回执：",data);
    alert("提交到服务器成功！");
    })
    .catch(error=>{
      console.error("糟糕，出错了：",error);
      alert("提交失败，请检查网络");
    });
  
  }
  
  let btn = document.getElementById("submitBtn");
  btn.addEventListener("click",sayHello);

</script>
</body>
</html>
